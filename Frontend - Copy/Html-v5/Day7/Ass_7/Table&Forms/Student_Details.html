    <section>
        <div>
            <h2><i>Student Registration</i></h2>
             <form action="/Hospital_Patient.html" method="post">
                <label for="sname">Student Name :</label>
                <input type="text"
                 id="sname" 
                 placeholder="name" 
                 required><br><br>
                <label for="email">Email :</label>
                <input type="email" 
                id="email" 
                placeholder="email"
                required> <br><br>
                <label for="password">Password :</label>
                <input type="password" 
                id="password" 
                placeholder="Password"
                required> <br><br>
                <label for="">Mobile Number :</label>
                <input type="tel"><br><br>
                <label for="age">Age :</label>
                <input type="number" 
                id="age" 
                required> <br><br>
                <label >Gender</label>
                <input type="radio" name="gender" value="Male">Male
                <input type="radio" name="gender" value="Female">Female
                <input type="radio" name="gender" value="Other">Other <br><br>

                 <label>Cource Selection :</label>
                <select name="select_course"  >
                <option value="">Select one..</option>
                <option value="">HTML</option>
                <option value="">CSS</option>
                <option value="">JS</option>
                <option value="">PYTHON</option>
                <option value="">JAVA</option>
                <option value="">SQL</option>
                <option value="">MANGO DP</option>
                </select><br><br>
                <label for="">Skills :</label>
                <input type="checkbox" value="">HTML
                <input type="checkbox" value="">CSS
                <input type="checkbox" value="">JavaScript
                <input type="checkbox" value="">Pyhton
                <br> <br>
                <label>Address :</label><br>
                <textarea 
                name="address" 
                rows="5" 
                cols="35">
                </textarea><br><br>
                <label>Profile Image:</label><br>
                <input type="file" name="profile"> <br><br>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
             </form>
        </div>
