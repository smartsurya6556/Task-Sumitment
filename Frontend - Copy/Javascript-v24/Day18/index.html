<!-- Day 18 - Login, Register & User Authentication Dashboard -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 18 – Login, Register & Auth Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .back-btn { position: fixed; top: 16px; left: 16px; color: #38bdf8; background: #1e293b; padding: 8px 16px; border-radius: 9999px; text-decoration: none; font-weight: 700; font-size: 13px; border: 1px solid #334155; transition: 0.2s; }
        .back-btn:hover { background: #334155; color: #fff; }
        .auth-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 20px; color: #38bdf8; text-align: center; }
        label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 14px; margin-bottom: 16px; outline: none; transition: 0.2s; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        button[type="submit"] { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 4px; }
        button[type="submit"]:hover { background: #0369a1; transform: translateY(-1px); }
        .toggle-btn { background: transparent; border: none; color: #94a3b8; font-size: 13px; cursor: pointer; width: 100%; text-align: center; margin-top: 16px; text-decoration: underline; }
        .toggle-btn:hover { color: #38bdf8; }
        .message { font-size: 13px; text-align: center; margin-top: 12px; font-weight: 600; min-height: 20px; color: #4ade80; }
        .dashboard-info { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin: 16px 0; }
        .dashboard-info p { margin-bottom: 10px; font-size: 14px; color: #cbd5e1; }
        .dashboard-info strong { color: #94a3b8; }
        .logout-btn { width: 100%; padding: 12px; background: #dc2626; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { background: #b91c1c; }
    </style>
</head>

<body>
    <a href="../../../index.html" class="back-btn">← Back to DevTask HUB</a>

    <!-- Register Page -->
    <div id="registerPage" class="auth-card">
        <h1>Create Account</h1>
        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="registerName" placeholder="e.g. Surya" required>

            <label>Email Address</label>
            <input type="email" id="registerEmail" placeholder="e.g. surya@example.com" required>

            <label>Password</label>
            <input type="password" id="registerPassword" placeholder="••••••••" required>

            <button type="submit">Register Account</button>
        </form>
        <p id="registerMessage" class="message"></p>
        <button class="toggle-btn" onclick="showLogin()">
            Already have an account? Login here
        </button>
    </div>

    <!-- Login Page -->
    <div id="loginPage" class="auth-card" style="display: none;">
        <h1>User Login</h1>
        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit">Sign In</button>
        </form>
        <p id="loginMessage" class="message" style="color: #f87171;"></p>
        <button class="toggle-btn" onclick="showRegister()">
            Don't have an account? Create New Account
        </button>
    </div>

    <!-- Dashboard -->
    <div id="dashboardPage" class="auth-card" style="display: none;">
        <h1>User Dashboard</h1>
        <h2 style="font-size: 18px; text-align: center; color: #f8fafc; margin-bottom: 16px;">
            Welcome, <span id="userName" style="color: #38bdf8;"></span> 👋
        </h2>

        <div class="dashboard-info">
            <h3 style="font-size: 13px; text-transform: uppercase; color: #64748b; margin-bottom: 10px; letter-spacing: 0.5px;">Registered Profile Details</h3>
            <p><strong>Name:</strong> <span id="dashboardName"></span></p>
            <p><strong>Email:</strong> <span id="dashboardEmail"></span></p>
            <p><strong>Status:</strong> <span style="color: #4ade80;">Active Session</span></p>
        </div>

        <button class="logout-btn" onclick="logout()">
            Sign Out
        </button>
    </div>

    <!-- JavaScript Connection -->
    <script src="assets/js/script.js"></script>
</body>
</html>
