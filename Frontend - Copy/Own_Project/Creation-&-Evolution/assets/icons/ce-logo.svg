<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ce-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#051b24"/>
    </linearGradient>
    <linearGradient id="ce-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ce-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ce-amp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ce-e-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ce-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ce-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#ce-border)" stroke-width="1.8"/>

  <!-- Orbital Micro Accents -->
  <circle cx="10" cy="10" r="2" fill="#38bdf8" filter="url(#ce-glow)"/>
  <circle cx="54" cy="54" r="2" fill="#34d399" filter="url(#ce-glow)"/>
  <circle cx="54" cy="10" r="1.2" fill="#818cf8" opacity="0.6"/>
  <circle cx="10" cy="54" r="1.2" fill="#818cf8" opacity="0.6"/>

  <!-- Subtle connecting dual-realm arc -->
  <path d="M12 32 C 16 18, 30 18, 32 32 C 34 46, 48 46, 52 32" stroke="url(#ce-border)" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.35"/>

  <!-- Main C&E Monogram Typography -->
  <!-- "C" Glyph -->
  <text x="7" y="42" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="27" fill="url(#ce-c-grad)" letter-spacing="-1">C</text>
  
  <!-- "&" Glyph -->
  <text x="25.5" y="40" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="url(#ce-amp-grad)">&amp;</text>
  
  <!-- "E" Glyph -->
  <text x="37.5" y="42" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="27" fill="url(#ce-e-grad)" letter-spacing="-1">E</text>
</svg>
