<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1120;
color:white;
}

/* Navbar */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:#111827;
position:sticky;
top:0px;
bottom: 20px;
}

.logo{
font-size:28px;
color:#00ffd5;
font-weight:bold;
}

nav ul{
display:flex;
list-style:none;
gap:20px;
}

nav ul li a{
color:rgb(227, 227, 227);
text-decoration:none;
padding:10px 15px;
border-radius:8px;
transition:.3s;
}

nav ul li a:hover{
background:#00ffd5;
color:black;
}

/* Hero */

.hero{
padding:60px;
text-align:center;
}

.horo c{padding:60px;
text-align:center;}


.hero h1{
font-size:50px;
color:#05efad;
margin-bottom:15px;
}

/* Cards */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:40px;
}

.card{
background:#1b2432;
padding:30px;
border-radius:15px;
text-align:center;
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 20px #00ffd5;
}

.card i{
font-size:60px;
color:#2470d3;
margin-bottom:20px;
}

.card h3{
margin-bottom:15px;
}

.card button{
padding:10px 20px;
border:none;
background:#b39e2b;
color:black;
font-weight:bold;
border-radius:30px;
cursor:pointer;
}

/* Topic Section */

#topics{
display:none;
padding:40px;
}

.topic-card{
background:#1b2432;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

.topic-card h2{
color:#00ffd5;
margin-bottom:15px;
}

.topic-card ul{
line-height:2;
padding-left:20px;
}

@media(max-width:768px){

nav{
flex-direction:column;
}

nav ul{
margin-top:15px;
flex-wrap:wrap;
justify-content:center;
}

.hero h1{
font-size:35px;

}

i {
    font-size: 20px;
    margin: 5px;
}

.fa-html5 {
    color: #d04823;
}

.fa-css3-alt {
    color: #1572B6;
}

.fa-js {
    color: #F7DF1E;
}
.js-card{
    border: 2px solid rgb(188, 188, 84);
    background: #1b2432;
}

}

</style>

</head>

<body>

<nav>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="frontend.html">Frontend</a></li>

<li><a href="backend.html">Backend</a></li>

<li><a href="database.html">Database</a></li>

</ul>

</nav>

<section class="hero">

<div class ="car">
  
  <i class="fa-solid fa-code"></i>

  <h1> Frontend </h1>
</div>

</section>

<section class="cards">

<div class="card">


 <i class="fa-brands fa-html5"></i>

<h3>HTML</h3>

<button onclick="showTopics()">View</button>

</div>

<div class="card">


<i class="fa-brands fa-css3-alt"></i>

<h3>CSS</h3>


<a href="frontend.html"><button>View</button></a>
</div>


<div class="card">
    <i class="fa-solid fa-laptop-code"></i>
    <h2>JAVASCRIPT</h2>
    <button>View</button>
</div>




</body>
</html>
