<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Computer Fundamentals</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1120;
color:white;
}

/* Navbar */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:#111827;
position:sticky;
top:0;
}

.logo{
font-size:28px;
color:#00ffd5;
font-weight:bold;
}

nav ul{
display:flex;
list-style:none;
gap:20px;
}

nav ul li a{
color:white;
text-decoration:none;
padding:10px 15px;
border-radius:8px;
transition:.3s;
}

nav ul li a:hover{
background:#00ffd5;
color:black;
}

/* Hero */

.hero{
padding:60px;
text-align:center;
}

.horo c{padding:60px;
text-align:center;}


.hero h1{
font-size:50px;
color:#05efad;
margin-bottom:15px;
}

/* Cards */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:40px;
}

.card{
background:#1b2432;
padding:30px;
border-radius:15px;
text-align:center;
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 20px #00ffd5;
}

.card i{
font-size:60px;
color:#42ae9c;
margin-bottom:20px;
}

.card h3{
margin-bottom:15px;
}

.card button{
padding:10px 20px;
border:none;
background:#b39e2b;
color:black;
font-weight:bold;
border-radius:30px;
cursor:pointer;
}

/* Topic Section */

#topics{
display:none;
padding:40px;
}

.topic-card{
background:#1b2432;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

.topic-card h2{
color:#00ffd5;
margin-bottom:15px;
}

.topic-card ul{
line-height:2;
padding-left:20px;
}

@media(max-width:768px){

nav{
flex-direction:column;
}

nav ul{
margin-top:15px;
flex-wrap:wrap;
justify-content:center;
}

.hero h1{
font-size:35px;
}

}

</style>

</head>

<body>

<nav>

<div style="display:flex; align-items:center; gap:15px;">
    <a href="../../../index.html" style="background:#00ffd5; color:black; font-weight:bold; text-decoration:none; padding:8px 16px; border-radius:20px; font-size:13px;">← DevTask HUB</a>
    <div class="logo">DevMustKnow</div>
</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="frontend.html">Frontend</a></li>

<li><a href="backend.html">Backend</a></li>

<li><a href="database.html">Database</a></li>

</ul>

</nav>

<section class="hero">

<h1>Full Stack Basics</h1>


  <h4>Click any button to view topics</h4>

</section>

<section class="cards">

<div class="card">

<i class="fa-solid fa-desktop"></i>

<h3>Computer Fundamentals</h3>

<button onclick="showTopics()">Visit</button>

</div>

<div class="card">

<i class="fa-solid fa-code"></i>

<h3>Frontend</h3>


<a href="frontend.html"><button>Visit</button></a>

</div>

<div class="card">

<i class="fa-solid fa-server"></i>

<h3>Backend</h3>

<a href="backend.html"><button>Visit</button></a>

</div>

<div class="card">

<i class="fa-solid fa-database"></i>

<h3>Database</h3>

<a href="database.html"><button >Visit</button></a>

</div>


<script>

function showTopics(){

document.getElementById("topics").style.display="block";

window.scrollTo({

top:document.getElementById("topics").offsetTop,

behavior:"smooth"

});

}

const cards=document.querySelectorAll(".card");

cards.forEach(card=>{

card.addEventListener("mouseenter",()=>{

card.style.transform="translateY(-10px) scale(1.05)";

});

card.addEventListener("mouseleave",()=>{

card.style.transform="translateY(0px) scale(1)";

});

});

</script>

</body>
</html>
